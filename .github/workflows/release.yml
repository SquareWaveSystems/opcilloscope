name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # MinVer needs the full commit history (and tags) to compute versions.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Keep the SDK/runtime pack aligned with the reviewed RID locks and notices.
          dotnet-version: '10.0.109'

      - name: Restore dependencies
        run: |
          dotnet restore Opcilloscope.csproj --locked-mode
          dotnet restore Tests/Opcilloscope.Tests/Opcilloscope.Tests.csproj

      - name: Validate third-party inventory
        run: ./scripts/verify-third-party-inventory.sh

      - name: Test
        run: dotnet test Tests/Opcilloscope.Tests/Opcilloscope.Tests.csproj --no-restore -c Release --verbosity normal

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: opcilloscope-linux-x64
            # smoke: runs the published binary natively on the host runner
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: opcilloscope-linux-arm64
          - os: windows-latest
            rid: win-x64
            artifact: opcilloscope-win-x64
            smoke: true
          - os: windows-latest
            rid: win-arm64
            artifact: opcilloscope-win-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: opcilloscope-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: opcilloscope-osx-arm64
            smoke: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # MinVer needs the full commit history (and tags) to compute versions.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Keep the SDK/runtime pack aligned with the reviewed RID locks and notices.
          dotnet-version: '10.0.109'

      - name: Restore dependencies
        # Use an explicit MSBuild property so NuGet selects the matching
        # packages.<rid>.lock.json before project evaluation.
        run: dotnet restore Opcilloscope.csproj -p:RuntimeIdentifier=${{ matrix.rid }} --locked-mode

      - name: Restore Linux E2E harness
        if: matrix.rid == 'linux-x64'
        run: dotnet restore Tests/Opcilloscope.E2ETests/Opcilloscope.E2ETests.csproj

      - name: Publish
        run: |
          dotnet publish Opcilloscope.csproj -c Release -r ${{ matrix.rid }} -o ./publish -p:DebugType=none --no-restore

      - name: Build Linux E2E harness
        if: matrix.rid == 'linux-x64'
        run: dotnet build Tests/Opcilloscope.E2ETests/Opcilloscope.E2ETests.csproj --no-restore -c Release

      - name: Test published Linux TUI over a real PTY
        if: matrix.rid == 'linux-x64'
        env:
          OPCILLOSCOPE_BIN: ${{ github.workspace }}/publish/opcilloscope
        run: dotnet test Tests/Opcilloscope.E2ETests/Opcilloscope.E2ETests.csproj --no-build -c Release --verbosity normal

      - name: Validate single-file layout (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          shopt -s nullglob dotglob
          entries=(./publish/*)
          if [ "${#entries[@]}" -ne 1 ] || [ "$(basename "${entries[0]}")" != "opcilloscope" ]; then
            echo "Expected exactly one published executable before adding notices"
            ls -la ./publish
            exit 1
          fi

      - name: Validate single-file layout (Windows)
        if: runner.os == 'Windows'
        run: |
          $entries = @(Get-ChildItem -Path ./publish -Force)
          if ($entries.Count -ne 1 -or $entries[0].Name -ne "opcilloscope.exe") {
            Get-ChildItem -Path ./publish -Force
            throw "Expected exactly one published executable before adding notices"
          }

      # --help intentionally exits before Terminal.Gui initialization. This is a
      # CLI/bundle-loading smoke; interactive TUI coverage belongs to the PTY suite.
      - name: Smoke test published CLI (Linux/macOS)
        if: matrix.smoke && runner.os != 'Windows'
        run: |
          chmod +x ./publish/opcilloscope
          ./publish/opcilloscope --help

      - name: Smoke test published CLI (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        run: |
          ./publish/opcilloscope.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Published binary exited with code $LASTEXITCODE" }

      - name: Copy license notices (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ./publish/licenses
          cp LICENSE THIRD-PARTY-NOTICES.md ./publish/
          cp licenses/* ./publish/licenses/

          runtime_package="Microsoft.NETCore.App.Runtime.${{ matrix.rid }}"
          runtime_version=$(jq -er --arg package "$runtime_package" \
            '.project.frameworks["net10.0"].downloadDependencies[] |
             select(.name == $package) | .version | ltrimstr("[") | split(",")[0]' \
            ./obj/project.assets.json)
          runtime_package_lower=$(printf '%s' "$runtime_package" | tr '[:upper:]' '[:lower:]')
          runtime_root="$HOME/.nuget/packages/${runtime_package_lower}/${runtime_version}"
          test -f "$runtime_root/LICENSE.TXT"
          test -f "$runtime_root/THIRD-PARTY-NOTICES.TXT"
          cp "$runtime_root/LICENSE.TXT" "./publish/licenses/DOTNET-RUNTIME-${{ matrix.rid }}-LICENSE.txt"
          cp "$runtime_root/THIRD-PARTY-NOTICES.TXT" "./publish/licenses/DOTNET-RUNTIME-${{ matrix.rid }}-THIRD-PARTY-NOTICES.txt"

          extensions_notice="$HOME/.nuget/packages/microsoft.extensions.dependencyinjection/10.0.8/THIRD-PARTY-NOTICES.TXT"
          test -f "$extensions_notice"
          cp "$extensions_notice" ./publish/licenses/MICROSOFT-EXTENSIONS-THIRD-PARTY-NOTICES.txt

      - name: Copy license notices (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path ./publish/licenses -Force | Out-Null
          Copy-Item -Path LICENSE, THIRD-PARTY-NOTICES.md -Destination ./publish/
          Copy-Item -Path ./licenses/* -Destination ./publish/licenses/

          $runtimePackage = "Microsoft.NETCore.App.Runtime.${{ matrix.rid }}"
          $assets = Get-Content ./obj/project.assets.json -Raw | ConvertFrom-Json
          $runtimeDependency = $assets.project.frameworks.'net10.0'.downloadDependencies |
            Where-Object { $_.name -eq $runtimePackage } |
            Select-Object -First 1
          if (-not $runtimeDependency) {
            throw "Could not resolve $runtimePackage from obj/project.assets.json"
          }
          $runtimeVersion = (($runtimeDependency.version -replace '^\[', '') -split ',')[0].Trim()
          $runtimeRoot = Join-Path $env:USERPROFILE ".nuget\packages\$($runtimePackage.ToLowerInvariant())\$runtimeVersion"
          $runtimeLicense = Join-Path $runtimeRoot "LICENSE.TXT"
          $runtimeNotices = Join-Path $runtimeRoot "THIRD-PARTY-NOTICES.TXT"
          if (-not (Test-Path $runtimeLicense) -or -not (Test-Path $runtimeNotices)) {
            throw "Could not find .NET runtime license material at $runtimeRoot"
          }
          Copy-Item $runtimeLicense "./publish/licenses/DOTNET-RUNTIME-${{ matrix.rid }}-LICENSE.txt"
          Copy-Item $runtimeNotices "./publish/licenses/DOTNET-RUNTIME-${{ matrix.rid }}-THIRD-PARTY-NOTICES.txt"

          $extensionsNotice = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.extensions.dependencyinjection\10.0.8\THIRD-PARTY-NOTICES.TXT"
          if (-not (Test-Path $extensionsNotice)) {
            throw "Could not find Microsoft.Extensions notices at $extensionsNotice"
          }
          Copy-Item $extensionsNotice ./publish/licenses/MICROSOFT-EXTENSIONS-THIRD-PARTY-NOTICES.txt

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish
          find . -type d -exec chmod 0755 {} +
          find . -type f ! -name opcilloscope -exec chmod 0644 {} +
          chmod 0755 opcilloscope
          tar -czf ../${{ matrix.artifact }}.tar.gz .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
