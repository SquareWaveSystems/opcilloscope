name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # MinVer needs the full commit history (and tags) to compute versions.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --verbosity normal

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: opcilloscope-linux-x64
            # smoke: runs the published binary natively on the host runner
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: opcilloscope-linux-arm64
          - os: windows-latest
            rid: win-x64
            artifact: opcilloscope-win-x64
            smoke: true
          - os: windows-latest
            rid: win-arm64
            artifact: opcilloscope-win-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: opcilloscope-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: opcilloscope-osx-arm64
            smoke: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # MinVer needs the full commit history (and tags) to compute versions.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: |
          dotnet publish Opcilloscope.csproj -c Release -r ${{ matrix.rid }} -o ./publish -p:DebugType=none

      - name: Smoke test published binary (Linux/macOS)
        if: matrix.smoke && runner.os != 'Windows'
        run: |
          chmod +x ./publish/opcilloscope
          # Run under a pseudo-tty so Terminal.Gui's Application.Init can initialize even on
          # a headless runner; `script -e` propagates the binary's exit code.
          TERM=xterm script -qec "./publish/opcilloscope --help" /dev/null
          code=$?
          echo "Published binary exited with code $code"
          test "$code" -eq 0

      - name: Smoke test published binary (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        run: |
          ./publish/opcilloscope.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Published binary exited with code $LASTEXITCODE" }

      - name: Copy license notices (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md ./publish/

      - name: Copy license notices (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item -Path LICENSE, THIRD-PARTY-NOTICES.md -Destination ./publish/

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish
          chmod +x opcilloscope || true
          tar -czvf ../${{ matrix.artifact }}.tar.gz *

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
